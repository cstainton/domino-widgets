name: Both browser backends
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [development, production]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: browser-tests/package-lock.json
      - name: Build both compilers and analyze bytecode
        run: |
          if [ '${{ matrix.mode }}' = production ]; then
            mvn -B -ntp -Pproduction clean verify
          else
            mvn -B -ntp clean verify
          fi
      - name: Verify packaging and prepare browser fixtures
        run: |
          python3 scripts/generate-showcase.py --check
          python3 scripts/check-analysis.py
          python3 scripts/check-artifacts.py
          python3 scripts/member-inventory.py
          python3 scripts/prepare-sites.py
      - run: npm ci
        working-directory: browser-tests
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: browser-tests
      - name: Verify native scrolling with Playwright Java
        run: mvn -B -ntp -f browser-tests/platform-checks/pom.xml test
      - run: npm test
        working-directory: browser-tests
        env:
          PLAYWRIGHT_CHANNEL: chromium
          BROWSERS: chromium,firefox,webkit
      - name: Index analyzer results
        if: always()
        run: python3 scripts/spotbugs-index.py
      - name: Record verification metadata
        run: python3 scripts/record-results.py ${{ matrix.mode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.mode }}
          path: |
            **/target/spotbugs/**
            **/target/surefire-reports/**
            browser-tests/test-results/**
            browser-tests/platform-checks/target/screenshots/**
            reports/**
            target/intake/inventory.json
            upstream/*lock.json
      - name: Assemble verified production showcases
        if: matrix.mode == 'production'
        run: python3 scripts/assemble-pages.py
      - uses: actions/upload-artifact@v4
        if: matrix.mode == 'production'
        with:
          name: showcase-pages
          path: target/pages
